aid: houzz
name: Houzz
description: >-
  Houzz is a home renovation and design platform that connects homeowners with
  home professionals, products, and design inspiration, and operates Houzz Pro,
  an all-in-one business management SaaS for contractors and design
  professionals (3D floor plans, takeoffs, estimates, invoices, scheduling, CRM,
  and marketing). For commerce, Houzz runs a marketplace and exposes an official
  Seller/Vendor Commerce API (opened to third-party partners in 2016) that lets
  merchants sync product listings, inventory, pricing, and orders. API access is
  gated: sellers enable it under Settings > API in the Houzz dashboard or request
  it via sellerapi@houzz.com, then authenticate integrations with an App ID,
  Token, and User Name. Houzz does not publish a general-purpose public developer
  portal, OpenAPI spec, or first-party SDKs; integration is handled through the
  Seller/Vendor programs and Houzz Pro's pre-built integrations (QuickBooks,
  Zapier, Gmail, Google Calendar/Drive, Gusto).
